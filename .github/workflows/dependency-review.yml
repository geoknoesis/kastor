# Flags vulnerable dependencies introduced on pull requests (GitHub Dependency graph).
name: Dependency review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit all pinned dependency versions
        run: python scripts/audit-dependencies.py

      - name: Scan credential patterns without exposing matches
        run: python scripts/audit-secrets.py

      - name: Retain redacted audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-and-credential-audit
          path: build/review/*audit.json

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
