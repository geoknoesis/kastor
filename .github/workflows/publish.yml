# Publishes a tagged release to Maven Central (Central Portal bundle upload).
#
# Release procedure (see CONTRIBUTING.md#releases and docs/reference/release-checklist.md):
#   1. A release commit sets `version=X.Y.Z` in gradle.properties and finalizes CHANGELOG.md.
#   2. Tag it `vX.Y.Z` and push the tag. This workflow runs release readiness (release-readiness.yml) in
#      the same run, then waits for approval on the protected `release` environment, which holds the
#      secrets KASTOR_SIGNING_KEY, KASTOR_SIGNING_PASSWORD, CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD.
#      scripts/configure-github-release.sh creates that environment and the tag/branch rulesets.
#   3. The published bytes are the tested bytes: the publish job does NOT rebuild. It downloads the
#      `staged-release-ubuntu-latest` artifact that readiness staged, tested and consumed in this run,
#      verifies its checksums, signs every file with the release key, and zips that into the bundle.
#   4. Re-runs are guarded: every upload records its deployment id as the artifact
#      `central-deployment-<tag>`. Before uploading, all recorded ids for the tag are queried; any
#      deployment that is not FAILED (PENDING, VALIDATING, VALIDATED, PUBLISHING, PUBLISHED) blocks a new
#      upload. Drop it in the portal first (see docs/reference/release-checklist.md).
#   5. The bundle is uploaded with publishingType=USER_MANAGED. The job then polls the Central Portal
#      until the deployment is VALIDATED (success) or FAILED (job fails with the errors).
#      A maintainer releases the validated deployment from https://central.sonatype.com.
#   6. Bump main to the next `-SNAPSHOT`.
# Gradle Plugin Portal publication of com.geoknoesis.kastor.gen is not automated yet.
name: Publish release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CENTRAL_API: https://central.sonatype.com/api/v1/publisher
  # Probe artifact for the "already published" check (every release contains rdf-core).
  CENTRAL_NAMESPACE: com.geoknoesis.kastor
  CENTRAL_PROBE_ARTIFACT: rdf-core

jobs:
  readiness:
    uses: ./.github/workflows/release-readiness.yml

  publish:
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # list and download earlier `central-deployment-<tag>` records
    environment:
      name: release
    steps:
      - name: Require release secrets
        # Fails before any work when the environment is misconfigured. Missing secrets expand to "".
        env:
          KASTOR_SIGNING_KEY: ${{ secrets.KASTOR_SIGNING_KEY }}
          KASTOR_SIGNING_PASSWORD: ${{ secrets.KASTOR_SIGNING_PASSWORD }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        shell: bash
        run: |
          missing=""
          for name in KASTOR_SIGNING_KEY KASTOR_SIGNING_PASSWORD CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD; do
            if [ -z "$(printf '%s' "${!name}" | tr -d '[:space:]')" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Blank or missing secrets in the 'release' environment:$missing (see scripts/configure-github-release.sh)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches the release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"
          case "$version" in
            ""|*-SNAPSHOT) echo "::error::gradle.properties version '$version' is not a release version"; exit 1 ;;
          esac
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version=$version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse versions already on Maven Central
        # Released versions are immutable on Central; re-running a published tag must stop here.
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          response="$(curl --fail-with-body --silent --show-error --retry 3 \
            --header "Authorization: Bearer $token" \
            "$CENTRAL_API/published?namespace=$CENTRAL_NAMESPACE&name=$CENTRAL_PROBE_ARTIFACT&version=$VERSION")"
          published="$(printf '%s' "$response" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("published", False)).lower())')"
          if [ "$published" = "true" ]; then
            echo "::error::$CENTRAL_NAMESPACE:$CENTRAL_PROBE_ARTIFACT:$VERSION is already published on Maven Central. Released versions are never reused: release a new version."
            exit 1
          fi
          echo "$CENTRAL_NAMESPACE:$CENTRAL_PROBE_ARTIFACT:$VERSION is not yet published"

      - name: Refuse a second deployment while an earlier one is still live
        # The Publisher API has no "list deployments" endpoint, and /published only reports PUBLISHED
        # components, so earlier uploads of this tag are tracked through `central-deployment-<tag>` artifacts.
        env:
          GH_TOKEN: ${{ github.token }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          RECORD: central-deployment-${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          records="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$RECORD&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .id')"
          blocking=""
          for artifact in $records; do
            dir="$(mktemp -d)"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$dir/record.zip"
            unzip -q -o "$dir/record.zip" -d "$dir"
            for id in $(cat "$dir"/deployment-id*.txt 2>/dev/null | tr -d '\r'); do
              code="$(curl --silent --show-error --retry 3 --output "$dir/status.json" --write-out '%{http_code}' \
                --request POST --header "Authorization: Bearer $token" "$CENTRAL_API/status?id=$id")"
              if [ "$code" = "404" ]; then echo "Deployment $id no longer exists (dropped)"; continue; fi
              if [ "$code" != "200" ]; then
                echo "::error::Central Portal status for recorded deployment $id returned HTTP $code; refusing to upload a possible duplicate"
                exit 1
              fi
              state="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("deploymentState", "UNKNOWN"))' "$dir/status.json")"
              echo "Recorded deployment $id: $state"
              [ "$state" = "FAILED" ] || blocking="$blocking $id($state)"
            done
          done
          if [ -n "$blocking" ]; then
            echo "::error::$GITHUB_REF_NAME already has live Central Portal deployments:$blocking. Release or drop them at https://central.sonatype.com/publishing/deployments (see docs/reference/release-checklist.md) before re-running."
            exit 1
          fi
          echo "No live deployment recorded for $GITHUB_REF_NAME"

      - name: Download the artifacts staged and tested by readiness in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-release-ubuntu-latest
          path: build

      - name: Verify staged checksums and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -d build/release-repository || { echo "::error::staged-release-ubuntu-latest has no release-repository"; exit 1; }
          python3 - <<'PY'
          import hashlib, pathlib, sys
          repo = pathlib.Path("build/release-repository")
          checked = 0
          for digest in ("sha1", "md5"):
              for sidecar in repo.rglob(f"*.{digest}"):
                  target = sidecar.with_suffix("")
                  expected = sidecar.read_text().split()[0].strip().lower()
                  actual = hashlib.new(digest, target.read_bytes()).hexdigest()
                  if actual != expected:
                      sys.exit(f"{digest} mismatch for {target}")
                  checked += 1
          if checked == 0:
              sys.exit("No checksum files found in the staged repository")
          print(f"{checked} staged checksums match")
          PY
          python scripts/check-staged-publications.py
          find build/release-repository -name '*.asc' -print -quit | grep -q . \
            && { echo "::error::Staged artifacts are already signed; readiness must stage unsigned"; exit 1; } || true

      - name: Sign the staged artifacts and build the Central Portal bundle
        env:
          KASTOR_SIGNING_KEY: ${{ secrets.KASTOR_SIGNING_KEY }}
          KASTOR_SIGNING_PASSWORD: ${{ secrets.KASTOR_SIGNING_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$KASTOR_SIGNING_KEY" | gpg --batch --import
          cd build/release-repository
          find . -name 'maven-metadata*' -delete
          count=0
          while IFS= read -r -d '' file; do
            printf '%s' "$KASTOR_SIGNING_PASSWORD" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign --output "$file.asc" "$file"
            gpg --batch --verify "$file.asc" "$file" 2>/dev/null
            count=$((count + 1))
          done < <(find . -type f ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' ! -name '*.asc' -print0)
          echo "Signed and verified $count files"
          missing=""
          while IFS= read -r file; do
            [ -f "$file.asc" ] || missing="$missing $file"
          done < <(find . -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \))
          if [ -n "$missing" ]; then echo "::error::Unsigned artifacts:$missing"; exit 1; fi
          mkdir -p ../central
          bundle="../central/kastor-$VERSION-central-bundle.zip"
          find . -type f | LC_ALL=C sort | zip -q -X "$bundle" -@
          rm -rf "$GNUPGHOME"
          echo "Bundle sha256: $(sha256sum "$bundle" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle to Maven Central Portal
        id: upload
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          # The response body is the deployment id.
          deployment="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $token" \
            --form "bundle=@build/central/kastor-$VERSION-central-bundle.zip" \
            "$CENTRAL_API/upload?name=kastor-$VERSION&publishingType=USER_MANAGED" | tr -d '[:space:]"')"
          if [ -z "$deployment" ]; then echo "::error::Central Portal returned no deployment id"; exit 1; fi
          echo "Deployment id: $deployment" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$deployment" > "build/central/deployment-id-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"

      - name: Record the deployment id for re-run protection
        if: always() && steps.upload.outputs.deployment != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-deployment-${{ github.ref_name }}
          path: build/central/deployment-id-*.txt
          retention-days: 90
          overwrite: true

      - name: Wait for Central Portal validation
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          DEPLOYMENT: ${{ steps.upload.outputs.deployment }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          deadline=$(( $(date +%s) + 30 * 60 ))
          delay=10
          while :; do
            status="$(curl --fail-with-body --silent --show-error --retry 3 --request POST \
              --header "Authorization: Bearer $token" \
              "$CENTRAL_API/status?id=$DEPLOYMENT")"
            state="$(printf '%s' "$status" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState", "UNKNOWN"))')"
            echo "$(date -u +%H:%M:%S) deployment $DEPLOYMENT: $state"
            case "$state" in
              VALIDATED)
                echo "::notice::Deployment $DEPLOYMENT validated. Release it at https://central.sonatype.com/publishing/deployments"
                exit 0 ;;
              PUBLISHING|PUBLISHED)
                echo "::notice::Deployment $DEPLOYMENT is $state"
                exit 0 ;;
              FAILED)
                echo "::error::Central Portal rejected deployment $DEPLOYMENT"
                printf '%s' "$status" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin).get("errors", {}), indent=2))'
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Deployment $DEPLOYMENT still $state after 30 minutes; check the Central Portal"
              exit 1
            fi
            sleep "$delay"
            delay=$(( delay * 2 > 60 ? 60 : delay * 2 ))
          done

      - name: Retain bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-bundle
          path: build/central/
          if-no-files-found: ignore
