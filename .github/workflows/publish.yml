# Publishes a tagged release to Maven Central (Central Portal bundle upload).
#
# Release procedure (see CONTRIBUTING.md#releases):
#   1. A release commit sets `version=X.Y.Z` in gradle.properties and finalizes CHANGELOG.md.
#   2. Tag it `vX.Y.Z` and push the tag. This workflow runs release readiness, then waits for
#      approval on the protected `release` environment, which holds the secrets
#      KASTOR_SIGNING_KEY, KASTOR_SIGNING_PASSWORD, CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD.
#   3. The bundle is uploaded with publishingType=USER_MANAGED: a maintainer releases the validated
#      deployment from https://central.sonatype.com after inspecting it.
#   4. Bump main to the next `-SNAPSHOT`.
# Gradle Plugin Portal publication of com.geoknoesis.kastor.gen is not automated yet.
name: Publish release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    uses: ./.github/workflows/release-readiness.yml

  publish:
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: release
    env:
      KASTOR_SKIP_EMBEDDING_TESTS: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify tag matches the release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"
          case "$version" in
            ""|*-SNAPSHOT) echo "::error::gradle.properties version '$version' is not a release version"; exit 1 ;;
          esac
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version=$version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build signed Central Portal bundle
        # The build itself refuses centralBundle without a signing key or for -SNAPSHOT versions.
        env:
          KASTOR_SIGNING_KEY: ${{ secrets.KASTOR_SIGNING_KEY }}
          KASTOR_SIGNING_PASSWORD: ${{ secrets.KASTOR_SIGNING_PASSWORD }}
        run: ./gradlew centralBundle --no-daemon
        shell: bash

      - name: Inspect metadata, documentation jars and signatures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-staged-publications.py
          missing=""
          while IFS= read -r file; do
            [ -f "$file.asc" ] || missing="$missing $file"
          done < <(find build/release-repository -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \))
          if [ -n "$missing" ]; then echo "::error::Unsigned artifacts:$missing"; exit 1; fi

      - name: Upload bundle to Maven Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $token" \
            --form "bundle=@build/central/kastor-$VERSION-central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=kastor-$VERSION&publishingType=USER_MANAGED"

      - name: Retain bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: central-bundle
          path: build/central/
