name: Live LLM integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run one bounded live fixture and the offline transport contracts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KASTOR_SKIP_OPENAI_LLM_TESTS: "0"
          KASTOR_SKIP_EMBEDDING_TESTS: "1"
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY secret is required'; exit 1; }
          ./gradlew :tools:onto-quality-llm-koog:test :tools:onto-quality-llm-koog:jacocoTestReport --no-daemon --max-workers=1
      - name: Require the live test to execute and preserve coverage
        run: |
          python scripts/check-test-results.py build/modules/tools/onto-quality-llm-koog/test-results/test --minimum 50 --require-suite com.geoknoesis.kastor.ontoquality.llm.OpenAiExplanationIntegrationTest
          python scripts/check-quality-gates.py coverage build/modules scripts/coverage-live-llm.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-llm-evidence
          path: |
            build/modules/tools/onto-quality-llm-koog/reports/
            build/modules/tools/onto-quality-llm-koog/test-results/
