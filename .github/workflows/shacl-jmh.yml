# Optional JMH run for the native SHACL benchmark module (manual / scheduled).
# Does not gate merges; use for collecting timing artifacts. See docs/kastor/design/shacl-native-engine-benchmark.md

name: SHACL JMH benchmarks

on:
  workflow_dispatch: {}
  schedule:
    # Weekly Sunday 06:00 UTC
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run JMH
        run: ./gradlew :benchmarks:shacl:jmh --no-daemon
        shell: bash

      - name: Upload JMH results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shacl-jmh-results
          path: build/modules/benchmarks/shacl/results/jmh/
