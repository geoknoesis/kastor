# Optional JMH run for the native SHACL benchmark module (manual / scheduled).
# Does not gate merges; use for collecting timing artifacts. See docs/kastor/design/shacl-native-engine-benchmark.md

name: SHACL JMH benchmarks

on:
  workflow_dispatch: {}
  schedule:
    # Weekly Sunday 06:00 UTC
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    # Typical runs take 2-5 minutes; generous headroom for a slow runner or a cold Gradle cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run JMH
        run: ./gradlew :benchmarks:shacl:jmh --no-daemon
        shell: bash

      - name: Upload JMH results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shacl-jmh-results
          path: build/modules/benchmarks/shacl/results/jmh/
