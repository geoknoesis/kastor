# Optional JMH run for the native SHACL benchmark module (manual / scheduled).
# Does not gate merges; use for collecting timing artifacts. See docs/kastor/design/shacl-native-engine-benchmark.md

name: SHACL JMH benchmarks

on:
  workflow_dispatch: {}
  schedule:
    # Weekly Sunday 06:00 UTC
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run JMH
        run: ./gradlew :benchmarks:shacl:jmh --no-daemon
        shell: bash

      - name: Upload JMH results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shacl-jmh-results
          path: build/modules/benchmarks/shacl/results/jmh/
