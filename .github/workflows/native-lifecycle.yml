name: Native embedding lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 3" # Weekly native inference and resource-lifecycle regression check.

permissions:
  contents: read

jobs:
  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      KASTOR_RUN_EMBEDDING_TESTS: "1"
      KASTOR_RUN_SOAK_TESTS: "1"
      KASTOR_SOAK_CYCLES: "200"
      KASTOR_SKIP_EMBEDDING_TESTS: "0"
      KASTOR_OOPS_BENCHMARK: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the report gate
        run: python scripts/test_check_test_results.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify native inference, ownership and repeated cleanup
        shell: bash
        # The soak test's duration scales with KASTOR_SOAK_CYCLES, so it gets more than the 5-minute default per test.
        run: >-
          ./gradlew :tools:onto-quality-embed:test :tools:onto-quality:test
          :tools:onto-quality-embed:jacocoTestReport :tools:onto-quality:jacocoTestReport
          --no-daemon --max-workers=1 -Pkastor.test.timeout=20m
      - name: Require native line and branch coverage
        run: python scripts/check-quality-gates.py coverage build/modules scripts/coverage-native.json
      - name: Reject missing or skipped native tests
        run: >-
          python scripts/check-test-results.py build/modules/tools/onto-quality-embed/test-results/test --minimum 37
          --require-suite com.geoknoesis.kastor.ontoquality.embed.OnnxEmbeddingModelManualTest
          --require-suite com.geoknoesis.kastor.ontoquality.embed.NativeResourceSoakTest
      - name: Reject missing or skipped semantic integration tests
        run: >-
          python scripts/check-test-results.py build/modules/tools/onto-quality/test-results/test --minimum 125
          --require-suite com.geoknoesis.kastor.ontoquality.OopsBenchmarkTest
          --require-suite 'com.geoknoesis.kastor.ontoquality.OopsCalibrationTest$SemanticTierAfterEnrichment'
      - name: Retain native lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-lifecycle-${{ matrix.os }}
          path: |
            build/modules/tools/onto-quality-embed/reports/
            build/modules/tools/onto-quality-embed/test-results/
            build/modules/tools/onto-quality/reports/
            build/modules/tools/onto-quality/test-results/
