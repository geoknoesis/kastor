name: Conformance

# Full upstream RDF 1.2 + SHACL conformance matrices (scheduled / manual dispatch).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch pinned RDF and SHACL corpora
        # Commits are pinned in scripts/fetch-conformance-data.py (the same script used locally).
        # The old workflow cloned data-shapes `gh-pages` unpinned; upstream's new uniqueValuesFor-005 case
        # then failed every weekly run from 2026-07-20. Bump the pin deliberately, with the allowlist/engine.
        run: python scripts/fetch-conformance-data.py

      - name: RDF conformance tests
        run: ./gradlew :rdf:conformance:test --no-daemon
        shell: bash

      - name: SHACL 1.2 W3C tests (native)
        run: ./gradlew :rdf:shacl-validation:test --no-daemon
        shell: bash

      - name: Require populated conformance suites
        # Floors are ~90% of executed counts with the pinned corpora (RDF 1,898 of 2,108; SHACL module 282, of which W3C 166, on 2026-09-14).
        run: |
          python scripts/check-test-results.py build/modules/rdf/conformance/test-results/test --minimum 1700 --skip-allowlist scripts/test-skip-allowlist.json
          python scripts/check-test-results.py build/modules/rdf/shacl-validation/test-results/test --minimum 250 --require-suite com.geoknoesis.kastor.rdf.shacl.conformance.Shacl12NativeConformanceTest=150 --skip-allowlist scripts/test-skip-allowlist.json
