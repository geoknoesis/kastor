name: Conformance

# Full upstream RDF 1.2 + SHACL conformance matrices (scheduled / manual dispatch).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch pinned RDF and SHACL corpora
        # Commits are pinned in scripts/fetch-conformance-data.py (the same script used locally).
        run: python scripts/fetch-conformance-data.py

      - name: RDF conformance tests
        run: ./gradlew :rdf:conformance:test --no-daemon
        shell: bash

      - name: SHACL 1.2 W3C tests (native)
        run: ./gradlew :rdf:shacl-validation:test --no-daemon
        shell: bash

      - name: Require populated conformance suites
        # Floors are ~90% of executed counts on a clean build (RDF 1,849; SHACL 179 on 2026-09-12).
        run: |
          python scripts/check-test-results.py build/modules/rdf/conformance/test-results/test --minimum 1660 --skip-allowlist scripts/test-skip-allowlist.json
          python scripts/check-test-results.py build/modules/rdf/shacl-validation/test-results/test --minimum 160 --skip-allowlist scripts/test-skip-allowlist.json
