name: Conformance

# Full upstream RDF 1.2 + SHACL conformance matrices (scheduled / manual dispatch).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Checkout pinned RDF corpus
        uses: actions/checkout@v4
        with:
          repository: w3c/rdf-tests
          ref: 369a90d1a60c021b746df2e411da0ff36258a758
          path: rdf/conformance/test-data

      - name: Checkout pinned SHACL corpus
        uses: actions/checkout@v4
        with:
          repository: w3c/data-shapes
          ref: 94d8bc2bd4fc4fdc6f2964d1ec4a892329e05f06
          path: build/upstream-shacl

      - name: RDF conformance tests
        run: ./gradlew :rdf:conformance:test --no-daemon
        shell: bash

      - name: SHACL 1.2 W3C tests (native)
        run: |
          set -euo pipefail
          mkdir -p rdf/shacl/validation/test-data
          cp -R build/upstream-shacl/shacl12-test-suite rdf/shacl/validation/test-data/w3c-shacl12
          ./gradlew :rdf:shacl-validation:test --no-daemon
        shell: bash

      - name: Require populated conformance suites
        run: |
          python scripts/check-test-results.py build/modules/rdf/conformance/test-results/test --minimum 100
          python scripts/check-test-results.py build/modules/rdf/shacl-validation/test-results/test --minimum 150
