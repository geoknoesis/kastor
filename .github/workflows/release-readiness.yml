name: Release readiness

# Expected runtime: staged-consumer ~60-90 min per OS (full check, RDF 1.2 corpus, staging, two
# consumer builds); local-signing ~25-40 min (restages every publication with an ephemeral key).
# Timeouts leave headroom above that; publish.yml waits for all jobs.

on:
  workflow_dispatch:
  # Weekly on main, so staging, consumer builds and the performance comparison never go stale between releases
  # (the run before 2026-10 was 177 commits old and had never staged rdf-holon). Nothing is published.
  schedule:
    - cron: "0 6 * * 3" # Wednesdays 06:00 UTC, the day after the weekly CI run
  # Called by publish.yml before any artifact leaves the runner.
  workflow_call:

permissions:
  contents: read

jobs:
  performance:
    uses: ./.github/workflows/performance-regression.yml

  staged-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      KASTOR_SKIP_EMBEDDING_TESTS: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the report gate
        run: python scripts/test_check_test_results.py
      - name: Test the performance report gate
        run: python scripts/test_check_performance.py
      - name: Test the staged publication gate
        run: python scripts/test_check_staged_publications.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Fetch pinned RDF and SHACL corpora
        run: python scripts/fetch-conformance-data.py
      - name: Check and stage publications
        run: ./gradlew check :rdf:conformance:test conformanceSmokeTest cleanReleaseRepository publishAllPublicationsToStagingRepository --no-daemon
        shell: bash
      - name: Inspect metadata and documentation jars
        run: python scripts/check-staged-publications.py
      - name: Compile and execute independent Maven consumer
        run: ./gradlew -p release-smoke run --refresh-dependencies --no-daemon
        shell: bash
      - name: Consume published plugin and exercise cooperating KSP rounds
        run: ./gradlew -p release-plugin-smoke run --refresh-dependencies --configuration-cache --configuration-cache-problems=fail --no-daemon
        shell: bash
      - name: Verify plugin configuration cache reuse
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -p release-plugin-smoke run --configuration-cache --configuration-cache-problems=fail --no-daemon | tee plugin-cache.log
          grep -q 'Reusing configuration cache' plugin-cache.log
      - name: Audit pinned dependency versions
        run: python scripts/audit-dependencies.py
      - name: Verify executed test counts and skips
        # The global floor is about 90% of the lower bound of this run's population: 4,540 offline tests executed
        # by CI plus 1,943 RDF corpus cases (2026-10-25); the SHACL corpus only adds to that. The W3C SHACL suite
        # must run from the pinned corpus (all 166 cases execute), not the 4-case bundled fixture.
        shell: bash
        run: |
          python scripts/check-test-results.py build/modules --minimum 5800 --skip-allowlist scripts/test-skip-allowlist.json
          python scripts/check-test-results.py build/modules/rdf/conformance/test-results/test --minimum 1845 --skip-allowlist scripts/test-skip-allowlist.json
          python scripts/check-test-results.py build/modules/rdf/shacl-validation/test-results/test --minimum 460 \
            --require-suite "com.geoknoesis.kastor.rdf.shacl.conformance.Shacl12NativeConformanceTest=166" \
            --skip-allowlist scripts/test-skip-allowlist.json
      - name: Retain staged artifacts and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-release-${{ matrix.os }}
          path: |
            build/release-repository/
            build/modules/**/reports/
            build/review/

  local-signing:
    # Separate job: restaging with an ephemeral key doubles the staging work, and a signing failure
    # should be visible independently of consumer/test failures. Runs on the current HEAD every time,
    # so signing evidence always matches the artifact IDs and publications being released.
    needs: staged-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify local test signing and tamper rejection
        run: python scripts/verify-local-signing.py
      - name: Validate the signed staging repository
        run: python scripts/check-staged-publications.py
      - name: Retain signing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-signing-evidence
          path: |
            build/review/signing-verification.json
            build/review/test-signing-public.asc
            build/review/local-signing.log
