name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * 2" # Tuesdays 05:00 UTC (macOS coverage)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Skip embedding/semantic tests that download the all-MiniLM-L6-v2 ONNX model
      # from HuggingFace — the model is unavailable on the CI runner. These tests are
      # designed to run locally; they self-skip on this flag (see OopsCalibrationTest /
      # OopsBenchmarkTest). The opt-in ONNX manual test stays off unless
      # KASTOR_RUN_EMBEDDING_TESTS=1.
      KASTOR_SKIP_EMBEDDING_TESTS: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test the report gates
        run: |
          python scripts/test_check_test_results.py
          python scripts/test_check_staged_publications.py
          python scripts/test_check_build_pins.py
          python scripts/test_check_readme_imports.py

      - name: Documentation version references
        run: python scripts/check-doc-versions.py

      - name: Build pins match the version catalog
        # e.g. the kotlin-metadata-jvm buildscript pin in build.gradle.kts must equal `kotlin` in libs.versions.toml.
        run: python scripts/check-build-pins.py

      - name: README samples import what they use
        run: python scripts/check-readme-imports.py

      - name: Gradle check (tests, ABI, BOM coverage, coverage floors)
        run: ./gradlew check --no-daemon -x :rdf:conformance:test
        shell: bash

      - name: Dependency health (advisory)
        id: build-health
        # Advisory only: a failure here must not skip the conformance, test-count and coverage gates below.
        continue-on-error: true
        run: ./gradlew buildHealth --no-daemon
        shell: bash

      - name: Report advisory dependency health failure
        # continue-on-error turns the step green in the UI; surface the failure as a warning and in the summary.
        if: steps.build-health.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=buildHealth failed::Dependency health (advisory) failed on ${{ matrix.os }}. The job continues; see the 'Dependency health (advisory)' step log and build/reports/dependency-analysis."
          {
            echo "### :warning: buildHealth failed (advisory)"
            echo
            echo "\`./gradlew buildHealth\` failed on \`${{ matrix.os }}\`. The build continued because the step is advisory;"
            echo "check the *Dependency health (advisory)* step log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: RDF 1.2 conformance smoke
        run: ./gradlew :rdf:conformance:conformanceSmokeTest --no-daemon
        shell: bash

      - name: Verify executed test counts and skips
        # Floor is ~90% of the executed count without the RDF corpus and with the bundled SHACL fixture
        # (~1,850 on 2026-09-14 after the round-three merges); raise it as tests are added.
        # New skips must be listed in scripts/test-skip-allowlist.json.
        run: python scripts/check-test-results.py build/modules --minimum 1650 --skip-allowlist scripts/test-skip-allowlist.json

      - name: Coverage reports
        run: ./gradlew jacocoTestReport --no-daemon
        shell: bash

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}
          path: build/modules/**/reports/

      - name: Compile SHACL benchmark modules and smoke-test workloads
        # JMH + ERA CLI are not pulled in by `test`; compile explicitly and run every workload once so they do not rot.
        run: ./gradlew :benchmarks:shacl:jmhCompileGeneratedClasses :benchmarks:shacl:test :benchmarks:shacl-era-cli:classes --no-daemon
        shell: bash

  shacl-w3c-suite:
    # The `build` job only sees the 4-case bundled SHACL fixture. Run the pinned W3C SHACL 1.2 corpus on
    # every PR (Linux only, for cost); the RDF 1.2 corpus stays in conformance.yml / release-readiness.
    name: shacl-w3c-suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KASTOR_SKIP_EMBEDDING_TESTS: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch pinned SHACL corpus
        run: python scripts/fetch-conformance-data.py --only shacl

      - name: SHACL validation tests with the W3C SHACL 1.2 suite
        run: ./gradlew :rdf:shacl-validation:w3cConformanceTest --no-daemon
        shell: bash

      - name: Require the full W3C suite, not the bundled fixture
        # data-shapes 94d8bc2: 166 W3C cases, all executed (known deviations run and must fail with an
        # explicit unsupported-feature error), measured 2026-09-13.
        run: >-
          python scripts/check-test-results.py build/modules/rdf/shacl-validation/test-results/w3cConformanceTest
          --minimum 150
          --require-suite com.geoknoesis.kastor.rdf.shacl.conformance.Shacl12NativeConformanceTest=150
          --skip-allowlist scripts/test-skip-allowlist.json

      - name: Upload SHACL test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shacl-w3c-suite-reports
          path: build/modules/rdf/shacl-validation/reports/

  macos:
    # Full check on macOS for pushes to main and the weekly schedule (saves PR minutes).
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      KASTOR_SKIP_EMBEDDING_TESTS: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle check
        run: ./gradlew check :rdf:conformance:conformanceSmokeTest --no-daemon -x :rdf:conformance:test
        shell: bash

      - name: Verify executed test counts and skips
        run: python3 scripts/check-test-results.py build/modules --minimum 1650 --skip-allowlist scripts/test-skip-allowlist.json

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-macos
          path: build/modules/**/reports/
