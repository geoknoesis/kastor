name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * 2" # Tuesdays 05:00 UTC (macOS coverage)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for the 6-hour default; a normal run takes about 20 minutes on Windows.
    timeout-minutes: 120
    env:
      # Skip embedding/semantic tests that download the all-MiniLM-L6-v2 ONNX model
      # from HuggingFace — the model is unavailable on the CI runner. These tests are
      # designed to run locally; they self-skip on this flag (see OopsCalibrationTest /
      # OopsBenchmarkTest). The opt-in ONNX manual test stays off unless
      # KASTOR_RUN_EMBEDDING_TESTS=1.
      KASTOR_SKIP_EMBEDDING_TESTS: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The Python quality gates (gate-script unit tests, documentation versions, build pins, README imports and the
      # complexity ratchet) run inside `check` as :verifyQualityGates, exactly as they do locally. `--continue` keeps
      # one failing gate or module from hiding the results of every other module; each later verification step
      # runs whenever this one ran, so a red gate never skips the test, coverage or ABI evidence.
      - name: Gradle check (quality gates, tests, ABI, BOM coverage, coverage floors)
        id: check
        run: ./gradlew check --continue --no-daemon -x :rdf:conformance:test
        shell: bash

      # A Windows run once failed with "No buffer space available (maximum connections reached?)" on a loopback
      # connect. If a run fails, record the socket state so the next occurrence can be explained.
      - name: Network diagnostics (Windows, on failure)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          netsh int ipv4 show dynamicport tcp
          netsh int ipv4 show excludedportrange protocol=tcp
          Get-NetTCPConnection | Group-Object State | Select-Object Name, Count | Format-Table -AutoSize

      - name: Dependency health
        id: build-health
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: ./gradlew buildHealth --no-daemon
        shell: bash

      - name: Require reviewed dependency advice
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: python scripts/check-quality-gates.py dependencies build/reports/dependency-analysis/build-health-report.json scripts/dependency-advice-exceptions.json

      - name: RDF 1.2 conformance smoke
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: ./gradlew :rdf:conformance:conformanceSmokeTest --no-daemon
        shell: bash

      - name: Verify executed test counts and skips
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        # Floor is about 95% of the October offline population with the bundled SHACL fixture.
        # Per-module floors below prevent another module from hiding a missing suite.
        # New skips must be listed in scripts/test-skip-allowlist.json.
        run: python scripts/check-test-results.py build/modules --minimum 3400 --skip-allowlist scripts/test-skip-allowlist.json

      - name: Require each tested module to remain populated
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: python scripts/check-quality-gates.py tests build/modules scripts/test-module-minimums.json

      - name: Coverage reports
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: ./gradlew jacocoTestReport --no-daemon
        shell: bash

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}
          path: build/modules/**/reports/

      - name: Compile SHACL benchmark modules and smoke-test workloads
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        # JMH + ERA CLI are not pulled in by `test`; compile explicitly and run every workload once so they do not rot.
        run: ./gradlew :benchmarks:shacl:jmhCompileGeneratedClasses :benchmarks:shacl:test :benchmarks:shacl-era-cli:classes --no-daemon
        shell: bash

  shacl-w3c-suite:
    # The `build` job only sees the 4-case bundled SHACL fixture. Run the pinned W3C SHACL 1.2 corpus on
    # every PR (Linux only, for cost); the RDF 1.2 corpus stays in conformance.yml / release-readiness.
    name: shacl-w3c-suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KASTOR_SKIP_EMBEDDING_TESTS: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch pinned SHACL corpus
        run: python scripts/fetch-conformance-data.py --only shacl

      - name: SHACL validation tests with the W3C SHACL 1.2 suite
        run: ./gradlew :rdf:shacl-validation:w3cConformanceTest --no-daemon
        shell: bash

      - name: Require the full W3C suite, not the bundled fixture
        # data-shapes 94d8bc2: 166 W3C cases, all executed (known deviations run and must fail with an
        # explicit unsupported-feature error), measured 2026-09-13.
        run: >-
          python scripts/check-test-results.py build/modules/rdf/shacl-validation/test-results/w3cConformanceTest
          --minimum 150
          --require-suite com.geoknoesis.kastor.rdf.shacl.conformance.Shacl12NativeConformanceTest=150
          --skip-allowlist scripts/test-skip-allowlist.json

      - name: Upload SHACL test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shacl-w3c-suite-reports
          path: build/modules/rdf/shacl-validation/reports/

  macos:
    # Full check on macOS for pushes to main and the weekly schedule (saves PR minutes).
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      KASTOR_SKIP_EMBEDDING_TESTS: "1"
      KASTOR_SKIP_OPENAI_LLM_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle check (quality gates included)
        id: check
        run: ./gradlew check :rdf:conformance:conformanceSmokeTest --continue --no-daemon -x :rdf:conformance:test
        shell: bash

      - name: Verify executed test counts and skips
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: python3 scripts/check-test-results.py build/modules --minimum 3400 --skip-allowlist scripts/test-skip-allowlist.json

      - name: Require each tested module to remain populated
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        run: python3 scripts/check-quality-gates.py tests build/modules scripts/test-module-minimums.json

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-macos
          path: build/modules/**/reports/
