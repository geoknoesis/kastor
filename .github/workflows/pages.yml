# Build and deploy the Jekyll site under docs/ to GitHub Pages.
# Repository settings: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Set Jekyll baseurl for project site
        # https://USER.github.io/REPO/ — required for theme assets and relative_url
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          RNAME="${GITHUB_REPOSITORY#*/}"
          {
            echo ""
            echo "# Injected in CI for github.io project pages"
            echo "baseurl: \"/${RNAME}\""
            echo "url: \"https://${OWNER}.github.io\""
          } >> docs/_config.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Write and OIDC permissions are granted only to the job that deploys.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
