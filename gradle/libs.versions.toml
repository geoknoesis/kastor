[versions]
kotlin = "2.4.20"
coroutines = "1.10.2"
ksp = "2.3.12"
junit = "5.13.4"
junitPlatform = "6.1.3"
slf4j = "2.0.17"
jena = "6.2.0"
httpclient5 = "5.6.4"
rdf4j = "5.3.1"
onnxruntime = "1.18.0"
djlTokenizers = "0.31.1"
jmhGradle = "0.7.3"
jmh = "1.37"
koog = "0.8.0"
kotlinxSerializationJson = "1.8.1"
assertj = "3.27.7"
dependencyAnalysis = "3.12.0"
kotlinpoet = "2.2.0"
clikt = "5.0.1"
owlapi = "4.5.29"
hermit = "1.4.5.519"
jackson = "2.22.2"
jacksonAnnotations = "2.22"
jsoup = "1.23.2"
commonsLang3 = "3.20.0"
dokka = "2.2.0"
# Build-internal alignment platforms and security floors (applied through the non-published
# :build-platform project; never exported to consumers).
nettyBom = "4.2.18.Final"
opentelemetryBom = "1.66.0"
guava = "33.7.1-jre"
commonsBeanutils = "1.11.0"
httpcore5 = "5.4.3"
httpclient4 = "4.5.14"
mime4j = "0.8.15"
libthrift = "0.24.0"
lz4Java = "1.11.3"
# Gradle Plugin Portal publication plugin, applied by kastor-gen/gradle-plugin (marker + portal metadata).
pluginPublish = "2.2.1"
# CycloneDX SBOM generator, applied to every published module (attached as the `cyclonedx` classifier).
cyclonedx = "3.4.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

jena-libs = { module = "org.apache.jena:apache-jena-libs", version.ref = "jena" }
jena-arq = { module = "org.apache.jena:jena-arq", version.ref = "jena" }
jena-shacl = { module = "org.apache.jena:jena-shacl", version.ref = "jena" }
jena-tdb2 = { module = "org.apache.jena:jena-tdb2", version.ref = "jena" }

httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }

rdf4j-repository-api = { module = "org.eclipse.rdf4j:rdf4j-repository-api", version.ref = "rdf4j" }
rdf4j-repository-sail = { module = "org.eclipse.rdf4j:rdf4j-repository-sail", version.ref = "rdf4j" }
rdf4j-sail-memory = { module = "org.eclipse.rdf4j:rdf4j-sail-memory", version.ref = "rdf4j" }
rdf4j-sail-nativerdf = { module = "org.eclipse.rdf4j:rdf4j-sail-nativerdf", version.ref = "rdf4j" }
rdf4j-queryrender = { module = "org.eclipse.rdf4j:rdf4j-queryrender", version.ref = "rdf4j" }
rdf4j-runtime = { module = "org.eclipse.rdf4j:rdf4j-runtime", version.ref = "rdf4j" }
rdf4j-rio-jsonld = { module = "org.eclipse.rdf4j:rdf4j-rio-jsonld", version.ref = "rdf4j" }
rdf4j-rio-turtle = { module = "org.eclipse.rdf4j:rdf4j-rio-turtle", version.ref = "rdf4j" }
rdf4j-rio-rdfxml = { module = "org.eclipse.rdf4j:rdf4j-rio-rdfxml", version.ref = "rdf4j" }
rdf4j-rio-n3 = { module = "org.eclipse.rdf4j:rdf4j-rio-n3", version.ref = "rdf4j" }
rdf4j-rio-trig = { module = "org.eclipse.rdf4j:rdf4j-rio-trig", version.ref = "rdf4j" }
rdf4j-rio-nquads = { module = "org.eclipse.rdf4j:rdf4j-rio-nquads", version.ref = "rdf4j" }
rdf4j-sail-inferencer = { module = "org.eclipse.rdf4j:rdf4j-sail-inferencer", version.ref = "rdf4j" }
rdf4j-shacl = { module = "org.eclipse.rdf4j:rdf4j-shacl", version.ref = "rdf4j" }

onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
djl-huggingface-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djlTokenizers" }

koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-symbol-processing-aa-embeddable = { module = "com.google.devtools.ksp:symbol-processing-aa-embeddable", version.ref = "ksp" }
ksp-symbol-processing-common-deps = { module = "com.google.devtools.ksp:symbol-processing-common-deps", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
owlapi-distribution = { module = "net.sourceforge.owlapi:owlapi-distribution", version.ref = "owlapi" }
hermit = { module = "net.sourceforge.owlapi:org.semanticweb.hermit", version.ref = "hermit" }

jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "nettyBom" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetryBom" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-beanutils = { module = "commons-beanutils:commons-beanutils", version.ref = "commonsBeanutils" }
httpcore5 = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "httpcore5" }
httpcore5-h2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "httpcore5" }
httpclient4 = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclient4" }
apache-mime4j-core = { module = "org.apache.james:apache-mime4j-core", version.ref = "mime4j" }
libthrift = { module = "org.apache.thrift:libthrift", version.ref = "libthrift" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4Java" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhGradle" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
