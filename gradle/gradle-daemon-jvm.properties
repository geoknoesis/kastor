# Pin the Gradle daemon to Java 21. No toolchainUrl.* entries on purpose:
# the daemon JVM is resolved from a locally-installed/detected JDK 21 only
# (no unverified network download). CI provides JDK 21 via setup-java;
# local dev must have a JDK 21 installed. See gradle.properties
# (org.gradle.java.installations.auto-download=false).
toolchainVersion=21
