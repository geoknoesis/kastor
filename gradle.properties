# Enough headroom for Kotlin compilation and Dependency Analysis (buildHealth) on multi-module CI.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# Cap build concurrency. Gradle otherwise defaults max-workers to the CPU count; on a
# high-core, memory-constrained dev box (e.g. 20 cores) a full-project build/publish
# spawns enough concurrent ~2GB Kotlin/KSP JVMs to exhaust native memory and crash the
# JVM (Out of Memory Error in the JIT compiler / hs_err_pid logs). CI runners have few
# cores, so this cap is effectively a no-op there. Raise it on machines with more free RAM.
org.gradle.workers.max=4

# Do not download JDKs over the network; require a locally-installed/detected JDK 21
# for both the Java toolchain and the daemon (avoids unverified third-party JDK fetches).
org.gradle.java.installations.auto-download=false
