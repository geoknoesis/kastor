# Single source of truth for the Kastor version. Released versions are tagged `vX.Y.Z`
# (see CONTRIBUTING.md#releases). Never reuse a released version: main always carries
# the next `-SNAPSHOT`.
version=0.3.0-SNAPSHOT

# Daemon heap. Kotlin compilation and Dependency Analysis (buildHealth) need headroom on
# multi-module CI.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# Worker cap. `org.gradle.parallel` is not enabled, so this bounds Worker API work (Kotlin
# compile workers, Dokka, etc.), not project-parallel execution. Test JVM heap and fork
# count are bounded separately in the root build (`kastor.test.maxHeap`,
# `kastor.test.maxParallelForks`). Earlier JVM crash logs (hs_err_pid*) were caused by
# system-wide memory exhaustion (many concurrent JVMs, including TestKit daemons), not by
# the KSP JIT. Put machine-specific caps in ~/.gradle/gradle.properties rather than here.
org.gradle.workers.max=4

# Do not download JDKs over the network; require a locally-installed/detected JDK 21
# for both the Java toolchain and the daemon (avoids unverified third-party JDK fetches).
org.gradle.java.installations.auto-download=false

# Kotlin 2.4's build-finish collector sorts every cached profile by filesystem
# timestamp. Disable optional telemetry to keep local build shutdown bounded.
kotlin.internal.collectFUSMetrics=false
