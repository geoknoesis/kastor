# Enough headroom for Kotlin compilation and Dependency Analysis (buildHealth) on multi-module CI.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# Do not download JDKs over the network; require a locally-installed/detected JDK 21
# for both the Java toolchain and the daemon (avoids unverified third-party JDK fetches).
org.gradle.java.installations.auto-download=false
